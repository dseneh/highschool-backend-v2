# 🧹 Development Cleanup Workflow
# Runs tests and checks on pull requests and development branches

name: 🧹 Development Checks
on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - develop
      - feature/*
      - bugfix/*
      - hotfix/*

jobs:
  lint-and-test:
    name: 🔍 Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: backend_v2_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_v2_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: True
      CI_TESTING: True
      SECRET_KEY: test-secret-key-for-ci
      DB_NAME: backend_v2_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort

      - name: 🎨 Check code formatting
        run: |
          echo "🎨 Checking code formatting with black..."
          black --check --diff . || echo "⚠️ Code formatting issues found but continuing..."

      - name: 🔍 Lint code
        run: |
          echo "🔍 Linting code with flake8..."
          flake8 . --count --exit-zero --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🧪 Run tests
        run: |
          echo "🧪 Running Django tests..."
          python manage.py test users core students employees finance --verbosity=2

      - name: ✅ All checks passed
        run: echo "🎉 All development checks passed!"

  security-check:
    name: 🔒 Security Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: 🔒 Check for security vulnerabilities
        run: |
          echo "🔒 Checking for known security vulnerabilities..."
          safety check --json || true

      - name: 🛡️ Static security analysis
        run: |
          echo "🛡️ Running static security analysis..."
          bandit -r . -f json || true

      - name: ✅ Security checks completed
        run: echo "🔒 Security checks completed!"
