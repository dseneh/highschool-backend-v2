# 🧹 Development Cleanup Workflow
# Runs tests and checks on pull requests and development branches

name: 🧹 Development Checks
on:
  pull_request:
    branches: [ main, staging ]
  push:
    branches:
      - develop
      - feature/*
      - bugfix/*
      - hotfix/*

concurrency:
  group: development-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: 🔍 Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: backend_v2_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_v2_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: True
      CI_TESTING: True
      SECRET_KEY: test-secret-key-for-ci
      DB_NAME: backend_v2_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: 📦 Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system ruff

      - name: 🔍 Fast lint report
        run: |
          ruff check . \
            --select=E9,F63,F7,F82 \
            --exclude migrations,.venv,venv,env,node_modules,.tox,build,dist \
            || echo "⚠️ Existing lint issues found; see the concise report above."

      - name: 🧪 Run tests
        run: |
          echo "🧪 Running Django tests, including API security and tenant backup tests..."
          python manage.py test api users core students finance authorization backups \
            --parallel auto \
            --verbosity=1

      - name: ✅ All checks passed
        run: echo "🎉 All development checks passed!"

  security-check:
    name: 🔒 Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: 📦 Install security tools
        run: |
          uv pip install --system pip-audit bandit

      - name: 🔒 Check for security vulnerabilities
        run: pip-audit -r requirements.txt

      - name: 🛡️ Static security analysis
        run: bandit -r . -lll -iii -x ./.venv

      - name: ✅ Security checks completed
        run: echo "🔒 Security checks completed!"
