<!doctype html>
<html lang="en">
<body style="font-family:Arial,sans-serif;color:#172033;background:#f4f6f8;padding:24px">
  <div style="max-width:560px;margin:auto;background:#fff;border-radius:10px;padding:32px">
    <h1 style="font-size:22px;margin-top:0">Verify your sign-in</h1>
    <p>Hi {{ user_name }},</p>
    <p>Use this code to finish signing in to {{ school_name }}:</p>
    <p style="font-size:32px;font-weight:700;letter-spacing:8px;margin:28px 0">{{ verification_code }}</p>
    <p>This code expires in {{ expiry_minutes }} minutes and can be used only once.</p>
    <p style="color:#596579">If you did not attempt to sign in, change your password and contact your administrator.</p>
  </div>
</body>
</html>
