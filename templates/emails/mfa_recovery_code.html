<!doctype html>
<html lang="en">
<body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#172033">
  <div style="max-width:560px;margin:32px auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:32px;text-align:center">
    <h1 style="font-size:22px;margin:0 0 12px">Verify your recovery email</h1>
    <p>An administrator started a secure recovery of the email used for your {{ school_name }} sign-in verification.</p>
    <div style="font-size:34px;font-weight:700;letter-spacing:10px;margin:24px 0">{{ verification_code }}</div>
    <p>This code expires in {{ expiry_minutes }} minutes.</p>
    <p style="font-size:13px;color:#64748b">If you did not request this recovery, contact your administrator immediately.</p>
  </div>
</body>
</html>
