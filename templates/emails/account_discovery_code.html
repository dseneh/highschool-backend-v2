<!doctype html>
<html>
  <body style="margin:0;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a">
    <div style="max-width:560px;margin:32px auto;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px">
      <h1 style="font-size:22px;margin:0 0 12px">Find your EzySchool account</h1>
      <p style="color:#475569">Enter this verification code to view the schools associated with your account.</p>
      <p style="font-size:32px;font-weight:700;letter-spacing:8px;margin:28px 0">{{ code }}</p>
      <p style="color:#64748b;font-size:14px">This code expires in {{ expires_minutes }} minutes. If you did not request it, you can ignore this email.</p>
    </div>
  </body>
</html>
